<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visible365 | Client workspace sandbox</title><style>body{margin:0;background:#f4f5f7;color:#171b24;font:15px/1.5 system-ui,sans-serif}*{box-sizing:border-box}header{background:white;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce0e8}img{width:175px;max-width:45vw}main{max-width:1000px;margin:auto;padding:24px 5% 60px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;line-height:1.1}h2{letter-spacing:-.03em}p{color:#5d6574}.panel{background:white;border:1px solid #dce0e8;border-radius:18px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:13px;font-weight:650;margin:12px 0}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #b9c2d0;border-radius:10px;background:white;font:inherit;margin-top:4px}button{border:0;border-radius:10px;padding:12px 16px;background:#171b24;color:white;font:inherit;font-weight:650;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.45;cursor:not-allowed}button.alt{background:#e7ecfa;color:#171b24}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7193e9;outline-offset:3px}.banner{background:#e7ecfa;padding:10px;text-align:center;color:#324578;font-size:13px}.status{border-left:3px solid #7193e9;padding-left:12px}.error{color:#9b2626;white-space:pre-wrap}.muted{font-size:12px}.wrap{overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:9px}.check input{width:18px}.dark{background:#171b24;color:white}.dark p{color:#b4bbc7}@media(max-width:680px){.grid{grid-template-columns:1fr}.panel{padding:16px}} </style></head><body><header><img src="../assets/logo-light.svg" alt="Visible365"><div><button id="lang" class="alt">ES</button><button id="logout" hidden>Sign out</button></div></header><div class="banner" id="banner"></div><main><div id="notice" aria-live="polite" class="error"></div><div id="view"></div></main><script>
let lang='en',token='',email='',codeSent=false,me=null,tab='overview',busy=false;const t=(a,b)=>lang==='en'?a:b,$=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeurl=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}};const field=(name,label,type='text',value='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" required value="'+esc(value)+'"></label>';const area=(name,label,val='')=>'<label>'+label+'<textarea name="'+name+'" maxlength="3000" rows="4">'+esc(val)+'</textarea></label>';const action=(name,label,inside)=>'<form data-action="'+name+'">'+inside+'<button type="submit">'+label+'</button></form>';const money=p=>p==='growth'?249:149;
const SB="https://ydbvqhanloeovkowwmxp.supabase.co",PUB="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkYnZxaGFubG9lb3Zrb3d3bXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NjMwMzYsImV4cCI6MjExMTIzOTAzNn0.tR3lD-Ua352nlv454J-eTdnNzCt52OSmxhaGO9fPvdc",EDGE=SB+'/functions/v1/waas-auth-sandbox';
async function api(action,data={}){
 let url=EDGE,body={action,...data},authHeader=token?{authorization:'Bearer '+token}:{};
 if(action==='otp'){url=SB+'/auth/v1/otp';body={email:data.email,create_user:true};authHeader={}}
 if(action==='verify'){url=SB+'/auth/v1/verify';body={email:data.email,token:data.code,type:'email'};authHeader={}}
 if(action==='logout'){url=SB+'/auth/v1/logout?scope=local';body={}}
 const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',apikey:PUB,...authHeader},body:JSON.stringify(body),cache:'no-store',referrerPolicy:'no-referrer'});let j;try{j=await r.json()}catch{if(r.ok)return {ok:true};throw Error(t('Sandbox service unavailable.','Servicio de prueba no disponible.'))}
 if(!r.ok){
 const code=j.error_code||j.code||'';
 if(code==='UNAUTHORIZED_UNREGISTERED_API_KEY'||(action==='otp'&&r.status===401))throw Error(t('The sign-in connection was rejected. Please report this to Visible365.','La conexión de acceso fue rechazada. Avísale a Visible365.'));
 if(action==='otp'&&r.status===429)throw Error(t('Too many requests. Wait before requesting another code.','Demasiadas solicitudes. Espera antes de pedir otro código.'));

 if(r.status===401&&token){token='';me=null;render()}
 throw Error(action==='verify'?t('The code could not be verified. Check the code or request a new one.','No pudimos verificar el código. Revísalo o solicita otro.'):action==='otp'?t('We could not send your verification email. Please check the test email configuration.','No pudimos enviar tu correo de verificación. Revisa la configuración de prueba.'):t('Unable to complete this action. Please try again.','No pudimos completar esta acción. Inténtalo de nuevo.'));
 }return j
}

function render(){document.documentElement.lang=lang;$('#lang').textContent=t('ES','EN');$('#logout').textContent=t('Sign out','Salir');$('#logout').hidden=!token;$('#banner').textContent=t('SANDBOX • Test accounts only • No real customer data or live charges','PRUEBAS • Solo cuentas de prueba • Sin datos reales ni cobros reales');let h='';

else if(!me?.account){h='<h1>'+t('Start your project.','Comienza tu proyecto.')+'</h1><section class="panel">'+action('signup',t('Request plan','Solicitar plan'),field('business',t('Business name','Nombre del negocio'))+field('industry',t('Industry','Industria'))+'<label>'+t('Plan','Plan')+'<select name="plan"><option value="essential">Essential — $299 + $149/mo</option><option value="growth">Growth — $499 + $249/mo</option></select></label><label>'+t('Language','Idioma')+'<select name="language"><option value="en">English</option><option value="es">Español</option></select></label>'+area('notes',t('Goals and services','Metas y servicios'))+'<p>'+t('We review scope before payment. Prices exclude applicable tax.','Revisamos el alcance antes del pago. Los precios no incluyen impuestos aplicables.')+'</p>')+'</section>'}
else{const o=me.order,p=me.project,a=me.account;h='<h1>'+esc(a.business_name)+'</h1><div class="row">'+[['overview',t('Overview','Inicio')],['website',t('My website','Mi página')],['updates',t('Updates','Cambios')],['billing',t('Billing','Facturación')],...(me.admin?[['admin','Admin']]:[])].map(([k,v])=>'<button class="'+(tab===k?'':'alt')+'" data-tab="'+k+'">'+v+'</button>').join('')+'</div>';
if(tab==='overview')h+='<section class="panel dark"><h2>'+t('Your digital presence','Tu presencia digital')+'</h2><p>'+t('Project stage','Etapa del proyecto')+': '+esc(p?.stage)+'</p></section><div class="grid"><section class="panel"><h2>'+esc(o?.plan)+'</h2><p>$'+money(o?.plan)+' / '+t('month','mes')+'</p><div class="status">'+esc(o?.stage)+'</div></section><section class="panel"><h2>'+t('Included monthly edits','Cambios incluidos al mes')+'</h2><p>'+(o?.plan==='growth'?60:30)+' min</p><p class="muted">'+t('Allowance only; usage reconciliation pending.','Tiempo incluido; saldo por conciliar.')+'</p></section></div>';
if(tab==='website')h+='<section class="panel"><h2>'+t('Business onboarding','Datos de tu negocio')+'</h2>'+action('profile',t('Save details','Guardar datos'),'<label>'+t('Existing website (optional)','Página actual (opcional)')+'<input name="website" value="'+esc(a.website)+'"></label>'+area('notes',t('Services and goals','Servicios y metas'),a.notes))+'<p>'+t('Private uploads will be enabled after storage security review.','Las cargas privadas se habilitarán tras revisar la seguridad.')+'</p></section><section class="panel"><h2>'+t('Project progress','Avance del proyecto')+'</h2><p>'+esc(p?.stage)+'</p>'+(safeurl(p?.preview_url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(safeurl(p.preview_url))+'">'+t('Review design','Revisar diseño')+'</a>':'')+(p?.stage==='review'?action('approve_design',t('Approve design','Aprobar diseño'),''):'')+(safeurl(p?.live_url)?'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(safeurl(p.live_url))+'">'+t('Open live website','Abrir página publicada')+'</a></p>':'')+'</section>';
if(tab==='updates')h+='<section class="panel"><h2>'+t('Request an update','Solicita un cambio')+'</h2>'+action('request',t('Submit request','Enviar solicitud'),'<label>'+t('Category','Categoría')+'<select name="category"><option value="content">'+t('Content','Contenido')+'</option><option value="photos">'+t('Photos','Fotos')+'</option><option value="support">'+t('Support','Soporte')+'</option><option value="other">'+t('Other','Otro')+'</option></select></label>'+area('details',t('Description','Descripción')))+'</section>'+me.requests.map(r=>'<section class="panel"><strong>'+esc(r.status)+'</strong><p class="wrap">'+esc(r.details)+'</p><p>'+esc(r.reply)+'</p></section>').join('');
if(tab==='billing'){h+='<section class="panel"><h2>'+t('Subscription','Suscripción')+'</h2><p>'+esc(o?.plan)+' • '+esc(o?.stage)+'</p>';if(me.billing_enabled&&['approved','checkout_pending'].includes(o?.stage)){h+='<p class="wrap">'+esc(o.scope)+'</p><p>'+t('Initial payment: ','Pago inicial: ')+'$'+(o.plan==='growth'?748:448)+' + '+t('applicable tax','impuestos aplicables')+'</p><p>'+t('Then $','Después $')+money(o.plan)+'/mo</p>'+action('checkout',t('Open test checkout','Abrir pago de prueba'),'<p>'+t('Terms version','Versión de términos')+': '+esc(o.terms_version)+'</p><p>'+t('Review the written agreement supplied with your approved scope before accepting.','Revisa el contrato escrito entregado con tu alcance aprobado antes de aceptar.')+'</p><label class="check"><input type="checkbox" name="accept" required> '+t('I reviewed and accept the supplied agreement.','Revisé y acepto el contrato entregado.')+'</label>')}else if(me.billing_enabled&&['active','payment_issue','canceled'].includes(o?.stage))h+=action('billing',t('Manage billing','Administrar facturación'),'');else h+='<p>'+t('Billing is disabled in this authentication sandbox.','La facturación está desactivada en este entorno de prueba.')+'</p>';h+='</section>'}

}$('#view').innerHTML=h}
$('#lang').onclick=()=>{lang=lang==='en'?'es':'en';render()};$('#logout').onclick=async()=>{try{if(token)await api('logout')}catch{}finally{token='';me=null;codeSent=false;email='';render()}};
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.hasAttribute('data-admin-list')){try{const j=await api('admin_list');$('#admin-data').innerHTML=j.accounts.map(a=>{const o=j.orders.find(x=>x.user_id===a.user_id),p=j.projects.find(x=>x.user_id===a.user_id);return '<section class="panel"><h3>'+esc(a.business_name)+'</h3><p>'+esc(o?.stage)+' / '+esc(p?.stage)+'</p>'+action('admin_approve','Approve scope','<input type="hidden" name="user_id" value="'+esc(a.user_id)+'">'+area('scope','Agreed scope / written terms'))+action('admin_project','Set project status','<input type="hidden" name="user_id" value="'+esc(a.user_id)+'"><label>Stage<select name="stage">'+['onboarding','design','review','domain','live'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Preview URL<input name="preview_url" value="'+esc(p?.preview_url)+'"></label><label>Live URL<input name="live_url" value="'+esc(p?.live_url)+'"></label>')+j.requests.filter(r=>r.user_id===a.user_id).map(r=>'<p>'+esc(r.details)+'</p>'+action('admin_request','Update request','<input type="hidden" name="user_id" value="'+esc(a.user_id)+'"><input type="hidden" name="id" value="'+esc(r.id)+'"><label>Status<select name="status"><option>new</option><option>in_progress</option><option>done</option></select></label><label>Minutes<input type="number" name="minutes" min="0" max="6000" value="'+r.minutes+'"></label>'+area('reply','Reply',r.reply))).join('')+'</section>'}).join('')}catch(x){$('#notice').textContent=x.message}}});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;let f=e.target,act=f.dataset.action,data=Object.fromEntries(new FormData(f));$('#notice').textContent='';try{if(act==='otp'){email=data.email;await api(act,data);codeSent=true;render()}else if(act==='verify'){let j=await api(act,data);token=j.access_token;await load()}else{if(act==='checkout'){data.accept=data.accept==='on';data.terms_version=me.order.terms_version}if(act==='admin_request')data.minutes=Number(data.minutes);const j=await api(act,data);if(j.url){const url=safeurl(j.url);if(url&&['checkout.stripe.com','billing.stripe.com'].includes(new URL(url).hostname))location.assign(url);else throw Error('Unexpected payment URL')}else{await load();$('#notice').textContent=t('Saved.','Guardado.')}}}catch(x){$('#notice').textContent=x.message}finally{busy=false}});render();
