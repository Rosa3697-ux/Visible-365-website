 const review=intakeStep===groups.length;
 h+='<section class="panel"><div class="row"><strong>'+t('Step ','Paso ')+(intakeStep+1)+' / '+(groups.length+1)+'</strong><span class="muted">'+filled+' / '+required.length+' '+t('required answers','respuestas requeridas')+'</span></div><progress max="'+(groups.length+1)+'" value="'+(intakeStep+1)+'" style="width:100%;accent-color:#7193e9"></progress><form data-action="intake">';
 if(!review){const g=groups[intakeStep];h+='<h2>'+g.title[idx]+'</h2><p>'+g.desc[idx]+'</p>';for(const [k,en,es,rule,required] of g.fields){let val=x[k]||'',label=idx?es:en,show=Intake.visible(k,x);h+='<label data-intake-field="'+k+'" '+(show?'':'hidden style="display:none"')+'>'+label+(required?' *':'');if(k==='specialty')h+='<p class="muted">'+esc(Intake.prompt(a.industry)[idx])+'</p>';if(Array.isArray(rule)){h+='<select name="'+k+'"><option value="">'+t('Choose…','Elige…')+'</option>'+rule.filter(v=>v!=='bilingual'||plan==='growth').map(v=>'<option value="'+v+'" '+(v===val?'selected':'')+'>'+esc(Intake.options[v][idx])+'</option>').join('')+'</select>';}else if(rule>400)h+='<textarea name="'+k+'" maxlength="'+rule+'" rows="4">'+esc(val)+'</textarea>';else h+='<input name="'+k+'" maxlength="'+rule+'" value="'+esc(val)+'">';h+='</label>';}}
 else{h+='<h2>'+t('Review your website brief','Revisa el resumen de tu página')+'</h2><p>'+t('Confirm your business details before sending them for scope review.','Confirma tus datos antes de enviarlos a revisión de alcance.')+'</p>';for(const g of groups){h+='<h3>'+g.title[idx]+'</h3>';for(const [k,en,es,rule] of g.fields){if(!Intake.visible(k,x))continue;let v=x[k]||'';h+='<p class="wrap"><strong>'+esc(idx?es:en)+':</strong> '+esc(Array.isArray(rule)&&v?Intake.options[v]?.[idx]||v:v||'—')+'</p>';}}if(result.missing.length)h+='<p class="error">'+t('Please complete required answers before submitting.','Completa las respuestas requeridas antes de enviar.')+'</p>';h+='<label class="check"><input name="confirm" type="checkbox"> '+t('I confirm these details are accurate and may be used to prepare a proposed website scope.','Confirmo que estos datos son correctos y se pueden usar para preparar el alcance propuesto.')+'</label>';}
 h+='<div class="row">'+(intakeStep>0?'<button class="alt" type="submit" name="nav" value="back">'+t('Back','Atrás')+'</button>':'')+'<button class="alt" type="submit" name="nav" value="save">'+t('Save draft','Guardar borrador')+'</button><button type="submit" name="nav" value="'+(review?'submit':'next')+'">'+(review?t('Submit for review','Enviar a revisión'):t('Save and continue','Guardar y continuar'))+'</button></div></form></section>';return h;
}
function captureIntake(form){if(!form||form.dataset.action!=='intake'||!intakeLocal)return;for(const [k,v] of new FormData(form))if(k!=='confirm'&&k!=='nav')intakeLocal[k]=v;}
document.addEventListener('change',e=>{if(e.target.name==='domain_status'&&e.target.closest('form')?.dataset.action==='intake'){const el=document.querySelector('[data-intake-field="domain"]');if(el){el.hidden=e.target.value!=='owned';el.style.display=el.hidden?'none':'';}}});
async function saveIntake(form,button){captureIntake(form);const nav=button?.value||'save',submit=nav==='submit';if(submit&&!form.elements.confirm?.checked)throw Error(t('Please confirm your answers.','Confirma tus respuestas.'));let checked;try{checked=Intake.normalize(intakeLocal,me.order?.plan,submit)}catch(e){throw Error(t('Check your answers: ','Revisa tus respuestas: ')+e.message)}const r=await api('intake_save',{answers:checked.answers,revision:me.account.intake_revision,submit});intakeLocal=null;intakeRevision=null;if(nav==='next')intakeStep=Math.min(Intake.groups.length,intakeStep+1);if(nav==='back')intakeStep=Math.max(0,intakeStep-1);await load();$('#notice').textContent=submit?t('Submitted for scope review.','Enviado a revisión de alcance.'):t('Draft saved.','Borrador guardado.');}


const SESSION_KEY='visible365:sandbox:access:v1';
const validToken=v=>typeof v==='string'&&/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(v);
function setSession(value){if(!validToken(value))throw Error(t('Invalid sign-in response. Request a new code.','Respuesta de acceso inválida. Solicita otro código.'));token=value;try{sessionStorage.setItem(SESSION_KEY,value)}catch{}}
function clearSession(){token='';try{sessionStorage.removeItem(SESSION_KEY)}catch{}}
function savedSession(){try{return sessionStorage.getItem(SESSION_KEY)||''}catch{return ''}}
async function openWorkspace(){restoring=true;render();$('#notice').textContent='';try{await load()}catch(e){$('#notice').textContent=e.message}finally{restoring=false;render()}}
async function bootAuth(){
 const fragment=new URLSearchParams(location.hash.slice(1)), query=new URLSearchParams(location.search);
 const incoming=fragment.get('access_token'), callbackError=fragment.get('error')||fragment.get('error_code')||query.get('error')||query.get('error_code');
 const isCallback=incoming||callbackError||fragment.has('refresh_token')||fragment.has('type')||query.has('code');
 if(isCallback){history.replaceState(null,'',location.pathname);clearSession();me=null;}
 if(callbackError||(!incoming&&isCallback)){render();$('#notice').textContent=t('This sign-in link expired or was already used. Request a fresh code and enter it on this page.','Este enlace venció o ya se utilizó. Solicita otro código e ingrésalo en esta página.');return}
 if(incoming){
   if(!validToken(incoming)){render();$('#notice').textContent=t('Invalid sign-in link. Request a new code.','Enlace inválido. Solicita otro código.');return}
   restoring=true;render();
   try{const r=await fetch(SB+'/auth/v1/user',{headers:{apikey:PUB,authorization:'Bearer '+incoming},cache:'no-store',referrerPolicy:'no-referrer'});if(!r.ok)throw Error();const u=await r.json();if(!u.email_confirmed_at||typeof u.email!=='string'||!u.email)throw Error();linkAccount=u.email;linkToken=incoming;}catch{clearSession();$('#notice').textContent=t('This sign-in link could not be verified. Request a new code.','No se pudo verificar el enlace. Solicita otro código.')}finally{restoring=false;render()}return;
 }
 const prior=savedSession();if(validToken(prior)){token=prior;await openWorkspace()}else{clearSession();render()}
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;
 if(b.hasAttribute('data-link-cancel')){linkToken='';linkAccount='';clearSession();render()}
 if(b.hasAttribute('data-link-confirm')){if(!linkToken||!linkAccount)return;busy=true;try{setSession(linkToken);linkToken='';linkAccount='';me=null;await openWorkspace()}catch(e){$('#notice').textContent=e.message}finally{busy=false}}
 if(b.hasAttribute('data-retry-workspace')&&token){busy=true;try{await openWorkspace()}finally{busy=false}}
});

bootAuth().catch(()=>{restoring=false;render();$('#notice').textContent=t('Unable to open the session. Please sign in again.','No pudimos abrir la sesión. Accede nuevamente.')});
</script></body></html>
