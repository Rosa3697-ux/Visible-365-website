<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visible365 | Client experience prototype</title><style>
:root{--ink:#171b24;--paper:#f4f5f7;--blue:#7193e9;--muted:#5d6574;--line:#dce0e8;--white:#fff}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button{border:0;background:transparent;color:inherit}a{color:inherit}.top{display:flex;align-items:center;justify-content:space-between;padding:18px max(5%,calc((100vw - 1250px)/2));background:#fff;border-bottom:1px solid var(--line);gap:18px}.logo{width:178px;max-width:42vw}.top-actions{display:flex;gap:12px;align-items:center}.lang{padding:8px;border:1px solid var(--line);border-radius:9px}.demo{font-size:12px;padding:10px 5%;text-align:center;background:#e8edfa;color:#304779}.shell{max-width:1250px;margin:auto;padding:35px 5% 60px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#4d6094}h1,h2,h3,p{margin:0}h1{font-size:clamp(34px,5vw,52px);line-height:1.06;letter-spacing:-.055em}h2{font-size:24px;letter-spacing:-.035em}h3{font-size:18px;letter-spacing:-.02em}p{color:var(--muted)}.intro{display:grid;gap:12px;margin-bottom:28px}.steps{display:flex;gap:8px;margin-bottom:24px}.step{flex:1;border-top:3px solid var(--line);padding:9px 0;font-size:12px;color:var(--muted)}.step.active{border-color:var(--blue);font-weight:750;color:var(--ink)}.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.85fr);gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:16px;align-content:start}.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.plan{display:grid;text-align:left;gap:9px;border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff}.plan.selected{outline:2px solid var(--blue);background:#f5f7ff}.price{font-size:32px;font-weight:750;letter-spacing:-.05em}.price small{font-size:13px;font-weight:500;letter-spacing:0}.features{padding-left:17px;color:var(--muted);font-size:13px}.pill{display:inline-block;width:fit-content;border-radius:20px;background:#e8edfa;padding:5px 10px;font-size:11px;font-weight:700;color:#304779}.primary,.secondary{padding:13px 18px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;text-align:center}.primary{background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.money{font-weight:700;white-space:nowrap}.total{border-top:1px solid var(--line);padding-top:14px}.total .money{font-size:24px}.small{font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select,textarea{width:100%;min-width:0;border:1px solid #b9c2d0;border-radius:10px;background:#fff;color:var(--ink);padding:11px}.wide{grid-column:1/-1}.stack{display:grid;gap:12px}.timeline{display:grid;gap:13px}.timeline div{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #aab4c8;flex:none}.dot.on{background:var(--blue);border-color:var(--blue)}.dash{display:grid;grid-template-columns:220px 1fr;gap:24px}.sidebar{display:grid;gap:8px;align-content:start}.tab{text-align:left;padding:12px;border-radius:10px;color:var(--muted)}.tab.active{background:#e7ecfa;color:var(--ink);font-weight:750}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.dark p{color:#c5ccd9}.dark .eyebrow{color:#adbef2}.stat{font-size:28px;font-weight:750;letter-spacing:-.04em}.notice{padding:12px;border:1px solid #d2def4;border-radius:10px;background:#f1f5ff;color:#3b4f75;font-size:13px}.foot{margin:28px 0;font-size:12px;color:var(--muted)}.check{display:flex;align-items:flex-start;gap:9px;font-weight:500}.check input{width:18px;height:18px;margin-top:3px}.full{width:100%}.back{justify-self:start;text-decoration:underline}.actions{display:flex;flex-wrap:wrap;gap:10px}.requests{border-top:1px solid var(--line);padding-top:12px}.sr{position:absolute;left:-9999px}@media(max-width:760px){.top{padding:15px 5%}.shell{padding-top:23px}.cols,.dash,.cards,.formgrid{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap}.plans{gap:9px}.plan{padding:13px}.panel{padding:18px}.top-actions{gap:6px}.price{font-size:25px}.step{font-size:10px}.top-actions .secondary{padding:8px}.logo{width:145px}}@media(max-width:360px){.plans{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header class="top"><img class="logo" src="../assets/logo-light.svg" alt="Visible365"><div class="top-actions"><button id="language" class="lang" type="button">ES</button><button id="reset" class="secondary" type="button">Restart demo</button></div></header><div id="banner" class="demo"></div><main id="app" class="shell"></main><script>
const state={lang:'en',step:0,plan:'growth',tab:'overview',business:'Demo Roofing Co.',type:'roofing',site:'none',requests:[],consent:false};const $=s=>document.querySelector(s),t=(en,es)=>state.lang==='en'?en:es;const prices={essential:{monthly:149,setup:299},growth:{monthly:249,setup:499}};const money=n=>'$'+n.toLocaleString('en-US');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const plans=()=>Object.entries(prices).map(([key,p])=>'<button class="plan '+(state.plan===key?'selected':'')+'" aria-pressed="'+(state.plan===key)+'" data-plan="'+key+'"><span class="pill">'+(key==='growth'?t('Recommended','Recomendado'):t('One language','Un idioma'))+'</span><h3>'+key[0].toUpperCase()+key.slice(1)+'</h3><span class="price">'+money(p.monthly)+'<small> / '+t('mo','mes')+'</small></span><p>'+money(p.setup)+' '+t('one-time setup','pago inicial único')+'</p><ul class="features"><li>'+ (key==='growth'?t('5 core pages, bilingual','5 páginas en dos idiomas'):t('3 core pages','3 páginas principales'))+'</li><li>'+t('Hosting and SSL','Hosting y SSL')+'</li><li>'+(key==='growth'?t('60 min monthly edits','60 min de cambios al mes'):t('30 min monthly edits','30 min de cambios al mes'))+'</li>'+(key==='growth'?'<li>'+t('Portfolio, enhanced on-page SEO, monthly report','Portafolio, SEO y reporte mensual')+'</li>':'')+'</ul></button>').join('');
function summary(){const p=prices[state.plan];return '<aside class="panel"><span class="eyebrow">'+t('Your subscription','Tu suscripción')+'</span><h2>'+state.plan[0].toUpperCase()+state.plan.slice(1)+'</h2><div class="row"><span>'+t('One-time setup','Pago inicial único')+'</span><span class="money">'+money(p.setup)+'</span></div><div class="row"><span>'+t('First month','Primer mes')+'</span><span class="money">'+money(p.monthly)+'</span></div><div class="row total"><strong>'+t('Proposed first payment','Primer pago propuesto')+'</strong><span class="money">'+money(p.setup+p.monthly)+'</span></div><p class="small">'+t('Then '+money(p.monthly)+' monthly. Before applicable taxes. Illustrative billing schedule; final terms and scope must be approved before payment. Domain, email, new logos and extra work are separate.','Después, '+money(p.monthly)+' al mes. Antes de impuestos aplicables. Calendario ilustrativo; los términos y el alcance se aprueban antes del pago. Dominio, correo, logotipos nuevos y trabajo adicional se cobran por separado.')+'</p></aside>'}
function render(){document.documentElement.lang=state.lang;$('#language').textContent=t('ES','EN');$('#reset').textContent=t('Restart demo','Reiniciar demo');$('#banner').textContent=t('INTERACTIVE DESIGN PROTOTYPE • Fictional account • No payments or personal data are collected','PROTOTIPO INTERACTIVO • Cuenta ficticia • No se cobran pagos ni se recopilan datos personales');
let app=$('#app'),html='';
if(state.step<3){html='<div class="intro"><span class="eyebrow">'+t('Your digital presence starts here','Tu presencia digital comienza aquí')+'</span><h1>'+[t('Choose your plan.','Elige tu plan.'),t('Tell us about your business.','Cuéntanos de tu negocio.'),t('Review your subscription.','Revisa tu suscripción.')][state.step]+'</h1><p>'+[t('A professional website, managed for you.','Una página profesional, administrada por nosotros.'),t('A few simple details help us get started. Use fictional information only.','Unos datos sencillos para empezar. Usa información ficticia.'),t('Clear pricing before you continue to secure checkout.','Precios claros antes de continuar al pago seguro.')][state.step]+'</p></div><div class="steps">'+[t('01 / Plan','01 / Plan'),t('02 / Business','02 / Negocio'),t('03 / Review','03 / Revisión')].map((s,i)=>'<div class="step '+(i<=state.step?'active':'')+'">'+s+'</div>').join('')+'</div><div class="cols"><section class="panel">';
if(state.step===0)html+='<div class="plans">'+plans()+'</div><p class="small">'+t('Signature is planned but not yet available.','Signature está en preparación y aún no está disponible.')+'</p><button class="primary" data-next>'+t('Continue →','Continuar →')+'</button>';
if(state.step===1)html+='<form id="businessForm" class="stack"><div class="formgrid"><label class="wide">'+t('Business name (fictional)','Nombre del negocio (ficticio)')+'<input id="business" maxlength="80" required value="'+esc(state.business)+'"></label><label>'+t('Industry','Industria')+'<select id="industry">'+['roofing','painting','trucking','other'].map((v,i)=>'<option value="'+v+'" '+(state.type===v?'selected':'')+'>'+[t('Roofing','Techos / Roofing'),t('Painting','Pintura'),t('Trucking','Transporte'),t('Other','Otro')][i]+'</option>').join('')+'</select></label><label>'+t('Do you have a website?','¿Ya tienes una página web?')+'<select id="site"><option value="none" '+(state.site==='none'?'selected':'')+'>'+t('Not yet','Todavía no')+'</option><option value="existing" '+(state.site==='existing'?'selected':'')+'>'+t('Yes','Sí')+'</option></select></label></div><p class="small">'+t('The production flow will use verified sign-in, contact details and a private onboarding checklist. This demo collects nothing.','La versión final usará acceso verificado, datos de contacto y una lista privada de requisitos. Esta demo no recopila datos.')+'</p><button class="primary" type="submit">'+t('Review plan →','Revisar plan →')+'</button></form><button class="back" data-back>'+t('Back','Regresar')+'</button>';
if(state.step===2)html+='<h2>'+esc(state.business)+'</h2><p>'+t('We will confirm the scope, language, revision terms, billing start and cancellation conditions before you pay.','Confirmaremos el alcance, idioma, revisiones, inicio de cobros y condiciones de cancelación antes de pagar.')+'</p><div class="notice">'+t('Production checkout will be hosted by Stripe. This preview cannot charge a card or create a real account.','El pago real se hará en Stripe. Esta vista no puede cobrar una tarjeta ni crear una cuenta real.')+'</div><label class="check"><input id="consent" type="checkbox" '+(state.consent?'checked':'')+'>'+t('I understand this is a fictional walkthrough, not a purchase.','Entiendo que es una demostración ficticia, no una compra.')+'</label><button class="primary" data-next id="checkout" '+(state.consent?'':'disabled')+'>'+t('Simulate checkout & open client portal →','Simular pago y abrir portal →')+'</button><button class="back" data-back>'+t('Back','Regresar')+'</button>';
html+='</section>'+summary()+'</div>';
}else{const tabs=[['overview',t('Overview','Inicio')],['website',t('My website','Mi página web')],['updates',t('Request an update','Solicitar un cambio')],['billing',t('Billing','Facturación')],['support',t('Support','Soporte')]];html='<div class="intro"><span class="eyebrow">'+t('Client workspace • Preview','Portal del cliente • Demo')+'</span><h1>'+t('Welcome back.','Qué gusto verte.')+'</h1><p>'+esc(state.business)+'</p></div><div class="dash"><nav class="sidebar" aria-label="'+t('Client sections','Secciones del portal')+'">'+tabs.map(([v,l])=>'<button class="tab '+(v===state.tab?'active':'')+'" data-tab="'+v+'" '+(v===state.tab?'aria-current="page"':'')+'>'+l+'</button>').join('')+'</nav><div class="stack">';
if(state.tab==='overview')html+='<section class="panel dark"><span class="eyebrow">'+t('Website progress','Avance de tu página web')+'</span><h2>'+t('Let’s bring your business online.','Llevemos tu negocio a internet.')+'</h2><p>'+t('Next step: share your business details and photos.','Siguiente paso: comparte los datos y fotos de tu negocio.')+'</p><button class="secondary" data-tab="website" style="width:fit-content;color:#171b24">'+t('View onboarding →','Ver requisitos →')+'</button></section><div class="cards"><section class="panel"><span class="eyebrow">'+t('Your plan','Tu plan')+'</span><div class="stat">'+state.plan[0].toUpperCase()+state.plan.slice(1)+'</div><p>'+money(prices[state.plan].monthly)+' / '+t('month','mes')+'</p></section><section class="panel"><span class="eyebrow">'+t('Included updates','Cambios incluidos')+'</span><div class="stat">'+(state.plan==='growth'?60:30)+' min</div><p>'+t('Illustrative monthly allowance','Tiempo mensual ilustrativo')+'</p></section></div><section class="panel"><h3>'+t('Quick actions','Acciones rápidas')+'</h3><div class="actions"><button class="secondary" data-tab="updates">'+t('Request an update','Solicitar un cambio')+'</button><button class="secondary" data-tab="billing">'+t('Manage billing','Ver facturación')+'</button></div></section>';
if(state.tab==='website')html+='<section class="panel"><h2>'+t('My website','Mi página web')+'</h2><p>'+t('Example project timeline','Ejemplo del avance del proyecto')+'</p><div class="timeline">'+[t('Business details','Datos del negocio'),t('Photos and logo','Fotos y logotipo'),t('Design review','Revisión del diseño'),t('Domain connection','Conectar dominio'),t('Ready to launch','Lista para publicar')].map((v,i)=>'<div><span class="dot '+(i===0?'on':'')+'"></span>'+v+'</div>').join('')+'</div><div class="notice">'+t('Private file uploads, project status and design approval will be connected after authentication is configured.','Las cargas privadas de archivos, el avance y la aprobación del diseño se conectarán cuando configuremos el acceso seguro.')+'</div></section>';
if(state.tab==='updates')html+='<section class="panel"><h2>'+t('Request a website change','Solicita un cambio en tu página web')+'</h2><p>'+t('Try the request workflow with fictional details only.','Prueba el proceso con información ficticia.')+'</p><form class="stack" id="requestForm"><label>'+t('Request type','Tipo de cambio')+'<select id="requestType"><option>'+t('Text or business hours','Texto u horario')+'</option><option>'+t('Photos or portfolio','Fotos o portafolio')+'</option><option>'+t('Other change','Otro cambio')+'</option></select></label><label>'+t('What should we update?','¿Qué debemos actualizar?')+'<textarea id="requestText" required maxlength="350" rows="4" placeholder="'+t('Example: update the Saturday hours.','Ejemplo: actualizar el horario del sábado.')+'"></textarea></label><button class="primary" type="submit">'+t('Simulate request','Simular solicitud')+'</button></form><div aria-live="polite">'+state.requests.map((v,i)=>'<div class="requests"><strong>#'+(i+1)+' · '+esc(v.type)+'</strong><p>'+esc(v.text)+'</p><span class="pill">'+t('Simulated • not sent','Simulada • no enviada')+'</span></div>').join('')+'</div></section>';
if(state.tab==='billing')html+='<section class="panel"><h2>'+t('Billing and subscription','Facturación y suscripción')+'</h2><p>'+t('Your subscription in one place.','Tu suscripción en un solo lugar.')+'</p><div class="row"><strong>'+state.plan[0].toUpperCase()+state.plan.slice(1)+'</strong><span>'+money(prices[state.plan].monthly)+' / '+t('mo','mes')+'</span></div><div class="notice">'+t('Production will open the Stripe customer portal for payment methods, invoices and cancellation options. This demo has no payment records.','La versión final abrirá el portal de Stripe para métodos de pago, facturas y opciones de cancelación. Esta demo no tiene registros de pago.')+'</div><button class="primary" disabled>'+t('Manage subscription — not connected','Administrar suscripción — sin conexión')+'</button></section>';
if(state.tab==='support')html+='<section class="panel"><h2>'+t('We’re here to help.','Estamos para ayudarte.')+'</h2><p>'+t('Support will be available in English and Spanish. Requests and replies will be stored in your secure account.','Tendrás soporte en español e inglés. Las solicitudes y respuestas se guardarán en tu cuenta segura.')+'</p><button class="secondary" data-tab="updates">'+t('Try a support request','Probar una solicitud')+'</button></section>';
html+='</div></div>'}
app.innerHTML=html+'<p class="foot">'+t('Visible365 • Design prototype only. No information is transmitted or saved. Reload or restart to clear the session.','Visible365 • Prototipo de diseño. No se transmite ni guarda información. Recarga o reinicia para borrar la sesión.')+'</p>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='language'){state.lang=state.lang==='en'?'es':'en';render()}else if(b.id==='reset'){Object.assign(state,{step:0,plan:'growth',tab:'overview',business:'Demo Roofing Co.',type:'roofing',site:'none',requests:[],consent:false});render()}else if(b.dataset.plan){state.plan=b.dataset.plan;render()}else if(b.hasAttribute('data-next')){state.step++;render();window.scrollTo(0,0)}else if(b.hasAttribute('data-back')){state.step--;render();window.scrollTo(0,0)}else if(b.dataset.tab){state.tab=b.dataset.tab;render()}});
document.addEventListener('change',e=>{if(e.target.id==='consent'){state.consent=e.target.checked;$('#checkout').disabled=!state.consent}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='businessForm'){state.business=$('#business').value.trim();state.type=$('#industry').value;state.site=$('#site').value;state.step=2;render();window.scrollTo(0,0)}else if(e.target.id==='requestForm'){state.requests.push({type:$('#requestType').value,text:$('#requestText').value.trim()});render()}});render();
</script></body></html>
