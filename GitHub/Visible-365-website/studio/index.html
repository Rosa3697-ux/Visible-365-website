<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visible365 Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#171b24;color:#f4f5f7;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 20px 60px}header{display:flex;justify-content:space-between;align-items:center}a{color:#a9bfff}h1{font-size:clamp(38px,7vw,72px);line-height:1.05;letter-spacing:-.055em}h2{line-height:1.2}button,input,select{font:inherit}button,.cta{background:#7193e9;color:#171b24;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}label{display:grid;gap:5px;margin:12px 0}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #b4bbc7}input[type=color]{height:48px}input[type=range]{padding:0;accent-color:#7193e9}.layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}.controls,.stage{border:1px solid #424b5a;background:#242b37;border-radius:18px;padding:20px;min-width:0}.preview{position:relative;overflow:hidden;border-radius:12px;background:white;color:#171b24;max-width:100%;margin:auto;transition:max-width .25s}.preview.mobile{max-width:340px}.modern{background:var(--brand);color:white;padding:28px 18px;text-align:center;min-height:300px;display:grid;align-content:center;gap:10px}.modern h2{font-size:clamp(24px,4vw,42px);margin:8px 0;overflow-wrap:anywhere}.modern strong{letter-spacing:.12em;overflow-wrap:anywhere}.modern span{background:white;color:#171b24;border-radius:5px;padding:8px;margin:auto}.old{position:absolute;inset:0;background:white;color:#333;padding:22px;clip-path:inset(0 calc(100% - var(--split)) 0 0);overflow-wrap:anywhere}.old h3{margin-top:0}.line{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#7193e9}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.brandcard{background:var(--brand);color:white;padding:22px 12px;min-height:115px;border-radius:8px;overflow-wrap:anywhere}.brandcard.light{background:#f4f5f7;color:#171b24}small{color:#b4bbc7}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9bfff;outline-offset:3px}@media(max-width:700px){.layout{grid-template-columns:1fr}.controls,.stage{padding:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><header><a id="home" href="/es/">visible365</a><button id="lang">English</button></header><section id="businessLookup" style="padding:20px;border:1px solid #424b5a;border-radius:16px;margin:24px 0"></section><h1 id="title"></h1><p id="intro"></p><div class="layout"><section class="controls"><h2 id="custom"></h2><label><span id="nameLabel"></span><input id="name" maxlength="60" autocomplete="off"></label><label><span id="tradeLabel"></span><select id="trade"></select></label><label><span id="colorLabel"></span><input id="color" type="color" value="#26343b"></label><label><span id="viewLabel"></span><select id="view"><option value="desktop"></option><option value="mobile"></option></select></label><label><span id="compareLabel"></span><input id="split" type="range" min="0" max="100" value="0"></label></section><section class="stage" id="stage"><div class="preview" id="preview"><div class="modern"><strong id="brand"></strong><small id="industry" style="color:inherit"></small><h2 id="headline"></h2><p id="desc"></p><span id="quote"></span></div><div class="old"><h3 id="oldName"></h3><p id="oldText"></p><hr><p id="oldContact"></p></div><div class="line"></div></div><h2 id="identity"></h2><div class="cards"><div class="brandcard"><strong id="cardName"></strong><p id="cardTrade"></p></div><div class="brandcard light"><strong id="cardBack"></strong><p id="cardContact"></p></div></div><p><small id="note"></small></p><a id="cta" class="cta" href="/es/#contact"></a></section></div></main><script>

let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"es";const e=id=>document.getElementById(id);function render(){const c=data[lang],i=Number(e("trade").value)||0,n=e("name").value.trim()||c.fallback,t=c.trades[i];for(const k of ["title","intro","custom","nameLabel","tradeLabel","colorLabel","viewLabel","compareLabel","identity","quote","oldText","oldContact","cardBack","cardContact","note","cta"])e(k).textContent=c[k];e("trade").replaceChildren(...c.trades.map((v,j)=>new Option(v[0],j)));e("trade").value=i;e("view").options[0].text=c.desktop;e("view").options[1].text=c.mobile;e("name").placeholder=c.fallback;for(const k of ["brand","oldName","cardName"])e(k).textContent=n;for(const k of ["industry","cardTrade"])e(k).textContent=t[0];e("headline").textContent=t[1];e("desc").textContent=t[2];const color=e("color").value;const rgb=color.slice(1).match(/../g).map(x=>parseInt(x,16));const dark=rgb.map(x=>Math.round(x*.55).toString(16).padStart(2,"0")).join("");e("stage").style.setProperty("--brand","#"+dark);e("preview").style.setProperty("--split",e("split").value+"%");e("preview").classList.toggle("mobile",e("view").value==="mobile");document.documentElement.lang=lang;e("lang").textContent=lang==="es"?"English":"Español";e("home").href=lang==="es"?"/es/":"/";e("cta").href=e("home").href+"#contact"}for(const id of ["name","trade","color","view","split"])e(id).addEventListener("input",render);e("lang").onclick=()=>{lang=lang==="es"?"en":"es";render()};render();</script><script src="/business-lookup.js" defer></script></html>
